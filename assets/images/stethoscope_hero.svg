    <path d="M 180,75 C 180,45 155,30 142,25" stroke-width="6"/>
    <path d="M 220,75 C 220,45 245,30 258,25" stroke-width="6"/>
    <circle cx="140" cy="24" r="7" fill="#ffffff" stroke="none"/>
    <circle cx="260" cy="24" r="7" fill="#ffffff" stroke="none"/>
    <path d="M 180,75 L 180,95 A 35,35 0 0,1 200,130 L 200,165 C 200,240 140,290 85,270 C 35,250 30,180 75,140 C 120,100 190,100 200,130" stroke-width="7"/>
    <line x1="162" y1="90" x2="238" y2="90" stroke-width="5"/>
    
    <!-- Flexible tubing leading to chestpiece -->
    <path d="M 200,165 C 200,260 260,350 340,350 C 420,350 450,280 430,210 C 410,140 330,140 310,210 C 295,260 320,310 370,300" stroke-width="8"/>
    
