    <path d="M 250,60 L 275,60 L 283,45 L 295,80 L 307,35 L 319,68 L 328,60 L 345,60" stroke-width="4"/>
    
    <!-- Decorative subtle dots -->
    <circle cx="430" cy="90" r="4" fill="#ffffff" stroke="none"/>
    <circle cx="330" cy="110" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="280" cy="310" r="4" fill="#ffffff" stroke="none"/>
    <circle cx="120" cy="330" r="5" fill="#ffffff" stroke="none"/>
